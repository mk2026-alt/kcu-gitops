apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: 581601708151.dkr.ecr.ap-southeast-2.amazonaws.com/webapp:7cff5a52da3aa781a4d1fc8fa397e9a6e565ef74
          ports:
            - containerPort: 80

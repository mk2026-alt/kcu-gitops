apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: 581601708151.dkr.ecr.ap-southeast-2.amazonaws.com/webapp:6e4138fefccf79cbf9dc828377bb576ec9abc02d
          ports:
            - containerPort: 80
